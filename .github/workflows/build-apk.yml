name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload universal APK
        uses: actions/upload-artifact@v6
        with:
          name: Sayboard-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/Sayboard_Universal.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="master-build-${{ github.run_number }}"

          if gh release view "$release_tag" > /dev/null 2>&1; then
            gh release upload "$release_tag" \
              app/build/outputs/apk/debug/Sayboard_Universal.apk \
              --clobber
          else
            gh release create "$release_tag" \
              app/build/outputs/apk/debug/Sayboard_Universal.apk \
              --target "${{ github.sha }}" \
              --title "Master build #${{ github.run_number }}" \
              --notes "Automated APK build from commit ${{ github.sha }}." \
              --latest
          fi
